name: harness-validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  harness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check harness scripts
        run: |
          sh -n scripts/check.sh
          sh -n scripts/verify.sh
          ./scripts/check.sh

